<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 1. Basic Website Settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 2. Browser Tab Title -->
    <title>SkillBridge | Create Profile</title>

    <!-- 3. CSS Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #172554;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #dbe3f0;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .password-row {
            display: flex;
            gap: 8px;
        }

        .password-row input {
            flex: 1;
            min-width: 0;
        }

        .small-btn {
            border: none;
            background: #e0eaff;
            color: #1d4ed8;
            padding: 10px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .generate-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #e0eaff;
            color: #1d4ed8;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            line-height: 1.8;
            display: none;
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- 4. Profile Form Container -->
    <div class="container">

        <h1>Create Your Profile</h1>

        <p class="subtitle">
            Join SkillBridge and explore your career opportunities.
        </p>

        <form id="profileForm">

            <!-- 5. Student Name -->
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <!-- 6. Email ID -->
            <label for="email">Email ID</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >

            <!-- 7. Password -->
            <label for="password">Password</label>

            <div class="password-row">
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >
                <button
                    type="button"
                    class="small-btn"
                    onclick="togglePassword()"
                >Show</button>
            </div>

            <!-- 8. Generate Password -->
            <button
                type="button"
                class="generate-btn"
                onclick="generatePassword()"
            >
                🔐 Generate Password
            </button>

            <!-- 9. College Name -->
            <label for="college">College Name</label>
            <input
                type="text"
                id="college"
                placeholder="Enter your college name"
                required
            >

            <!-- 10. Education -->
            <label for="education">Education</label>
            <select id="education" required>
                <option value="">Select Education</option>
                <option>B.Tech CSE</option>
                <option>B.Tech IT</option>
                <option>B.Tech ECE</option>
                <option>B.Tech AI & Data Science</option>
                <option>Other</option>
            </select>

            <!-- 11. Current Year -->
            <label for="year">Current Year</label>
            <select id="year" required>
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <!-- 12. Skills -->
            <label for="skills">Your Skills</label>
            <input
                type="text"
                id="skills"
                placeholder="HTML, CSS, Python"
                required
            >

            <!-- 13. Career Goal -->
            <label for="goal">Career Goal</label>
            <select id="goal" required>
                <option value="">Select Career Goal</option>
                <option>Frontend Developer</option>
                <option>Backend Developer</option>
                <option>AI/ML Engineer</option>
                <option>Data Analyst</option>
                <option>Software Developer</option>
            </select>

            <!-- 14. Create Profile Button -->
            <button type="submit" class="submit-btn">
                Create Profile
            </button>

        </form>

        <!-- 15. Result Message -->
        <div id="message" aria-live="polite"></div>

        <!-- 16. Back to Login -->
        <a href="Login.html" class="back">
            ← Back to Login
        </a>

    </div>

    <!-- 17. JavaScript -->
    <script>

        // Password Show/Hide Function
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".small-btn");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }

        // Generate Password Function
        function generatePassword() {
            const upper = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            const lower = "abcdefghijkmnopqrstuvwxyz";
            const numbers = "23456789";
            const symbols = "@#$%&*!";

            const all = upper + lower + numbers + symbols;

            function randomIndex(max) {
                const array = new Uint32Array(1);
                const limit = Math.floor(4294967296 / max) * max;

                do {
                    crypto.getRandomValues(array);
                } while (array[0] >= limit);

                return array[0] % max;
            }

            const chars = [
                upper[randomIndex(upper.length)],
                lower[randomIndex(lower.length)],
                numbers[randomIndex(numbers.length)],
                symbols[randomIndex(symbols.length)]
            ];
            for (let i = 0; i < 8; i++) {
                chars.push(all[randomIndex(all.length)]);
            }

            for (let i = chars.length - 1; i > 0; i--) {
                const j = randomIndex(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            document.getElementById("password").value = chars.join("");
            document.getElementById("password").type = "text";
            document.querySelector(".small-btn").textContent = "Hide";
        }

        // Create Profile Form
        document.getElementById("profileForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const college = document.getElementById("college").value;
                const education = document.getElementById("education").value;
                const year = document.getElementById("year").value;
                const skills = document.getElementById("skills").value;
                const goal = document.getElementById("goal").value;

                const message = document.getElementById("message");

                // Password ko result mein show nahi karna
                message.textContent =
                    "Welcome, " + name + "! Your demo profile is ready. " +
                    "Email: " + email +
                    " | College: " + college +
                    " | Education: " + education +
                    " | Year: " + year +
                    " | Skills: " + skills +
                    " | Career Goal: " + goal;

                message.style.display = "block";
            });

    </script>

</body>
</html>
